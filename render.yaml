services:
  - type: web
    name: kalpro-hosting-bot
    runtime: docker
    plan: starter            # a persistent Disk needs a paid plan
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: SECOND_BOT_TOKEN   # the bot token from @BotFather (set it in the dashboard)
        sync: false
      - key: OWNER_ID           # defaults to ADMIN_ID when empty
        sync: false
      - key: ADMIN_ID
        value: "8680332219"
      - key: ADMIN_PASSWORD     # protects the /admin web panel
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: UPDATE_CHANNEL
        value: https://t.me/Ethio_Free_Datass
